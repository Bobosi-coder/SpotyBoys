[project]
name = "mlops"
version = "0.1.0"
description = "SpotyBoys local data engineering pipeline (no Docker required)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "requests>=2.28.0",
    "scipy>=1.9.0",
    "torch>=2.1.0",
    "tqdm>=4.64.0",
]

[project.scripts]
mlops-pipeline = "main:main"
