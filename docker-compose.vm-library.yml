services:
  fixture-music:
    command: ["python", "-c", "print('VM library mode: using host music mount; fixture generation skipped')"]
    volumes: []

  navidrome:
    volumes:
      - spotiboys-navidrome-data:/data
      - ${SPOTIBOYS_VM_MUSIC_ROOT:-/mnt/mlflow_persist_large/music}:/music:ro

  recommendation-api:
    environment:
      SPOTIBOYS_MEDIA_MODE: navidrome_vm_library
      SPOTIBOYS_MUSIC_ROOT: /music
      SPOTIBOYS_ENABLE_REAL_RUNTIME: ${SPOTIBOYS_ENABLE_REAL_RUNTIME:-false}
    volumes:
      - ${SPOTIBOYS_VM_MUSIC_ROOT:-/mnt/mlflow_persist_large/music}:/music:ro
      - spotiboys-serving-bundle:/serving-bundle:ro

  catalog-sync-worker:
    environment:
      SPOTIBOYS_MEDIA_MODE: navidrome_vm_library
