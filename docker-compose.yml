services:
  training:
    build: .
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT_URL=https://chi.tacc.chameleoncloud.org:7480
      - MLFLOW_TRACKING_URI=http://129.114.25.207:8000/
      - PYTHONWARNINGS=ignore:Unverified HTTPS request
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Override command at runtime:
    #   docker-compose run training bash scripts/retrain.sh --no-delta --retrieve-version 20260417_051148
    #   docker-compose run training bash scripts/retrain.sh --with-delta
    command: ["bash", "-c", "echo 'Specify command: bash scripts/retrain.sh --no-delta|--with-delta [--retrieve-version VERSION]'"]
