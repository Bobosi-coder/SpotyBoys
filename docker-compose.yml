name: spotyboys_service

x-recommendation-runtime: &recommendation-runtime
  build:
    context: .
    dockerfile: apps/recommendation-api/Dockerfile
  image: ${SPOTIBOYS_RECOMMENDATION_IMAGE:-spotiboys-vm1-recommendation-runtime:latest}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotiboys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - /mnt/mlflow_persist/spotiboys_v2/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotiboys"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  navidrome:
    image: ghcr.io/bobosi-coder/spotiboys-navidrome:latest
    environment:
      ND_SCANSCHEDULE: "1m"
      ND_LOGLEVEL: info
      ND_DATAFOLDER: /data
      ND_MUSICFOLDER: /music
      ND_EXTAUTH_TRUSTEDSOURCES: "0.0.0.0/0"
      ND_EXTAUTH_USERHEADER: "Remote-User"
      ND_ENABLEUSEREDITING: "false"
      ND_EXTAUTH_LOGOUTURL: "${SPOTIBOYS_PUBLIC_BASE_URL:-http://localhost:8089}/logout"
    volumes:
      - /mnt/mlflow_persist/spotiboys_v2/navidrome:/data
      - /mnt/mlflow_persist_large/music:/music:ro
    expose:
      - "4533"

  navidrome-extauth-bootstrap:
    <<: *recommendation-runtime
    command: ["python", "infra/scripts/bootstrap_navidrome.py"]
    environment:
      NAVIDROME_BASE_URL: http://navidrome:4533
      NAVIDROME_USERNAME: spotiboys
    depends_on:
      navidrome:
        condition: service_started

  seed-users-worker:
    <<: *recommendation-runtime
    command: ["python", "scripts/seed_30music_users.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
    depends_on:
      postgres:
        condition: service_healthy

  catalog-sync-worker:
    <<: *recommendation-runtime
    command: ["python", "workers/catalog-sync-worker/sync_catalog.py"]
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
      SPOTIBOYS_MEDIA_MODE: navidrome_vm_library
      SPOTIBOYS_MUSIC_ROOT: /music
      SPOTIBOYS_CATALOG_PROGRESS_EVERY: ${SPOTIBOYS_CATALOG_PROGRESS_EVERY:-500}
      SPOTIBOYS_CATALOG_SYNC_LIMIT: ${SPOTIBOYS_CATALOG_SYNC_LIMIT:-0}
      SPOTIBOYS_REFRESH_CATALOG_METADATA: ${SPOTIBOYS_REFRESH_CATALOG_METADATA:-false}
      NAVIDROME_BASE_URL: http://navidrome:4533
      NAVIDROME_USERNAME: spotiboys
    volumes:
      - /mnt/mlflow_persist_large/music:/music:ro
    depends_on:
      postgres:
        condition: service_healthy
      navidrome:
        condition: service_started
      navidrome-extauth-bootstrap:
        condition: service_completed_successfully

  navidrome-metadata-sync-worker:
    <<: *recommendation-runtime
    command: ["python", "infra/scripts/sync_navidrome_metadata.py"]
    volumes:
      - /mnt/mlflow_persist/spotiboys_v2/navidrome:/data
      - /mnt/mlflow_persist_large/music:/music:ro
    depends_on:
      navidrome:
        condition: service_started
      catalog-sync-worker:
        condition: service_completed_successfully

  artifact-fetch-worker:
    <<: *recommendation-runtime
    command: ["python", "workers/artifact-fetch-worker/fetch_remote_artifacts.py"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
      SPOTIBOYS_ACTIVE_ARTIFACT_ROOT: /serving-bundle
    volumes:
      - /mnt/mlflow_persist/spotiboys_v2/serving-bundle:/serving-bundle

  recommendation-api:
    <<: *recommendation-runtime
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      SPOTIBOYS_MEDIA_MODE: navidrome_vm_library
      SPOTIBOYS_MUSIC_ROOT: /music
      SPOTIBOYS_SERVING_BUNDLE_PATH: /serving-bundle/Real_service/active
      SPOTIBOYS_REQUIRE_FULL_ML_PIPELINE: ${SPOTIBOYS_REQUIRE_FULL_ML_PIPELINE:-true}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
      NAVIDROME_BASE_URL: http://navidrome:4533
      NAVIDROME_USERNAME: spotiboys
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://host.docker.internal:8080}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      SPOTIBOYS_ADMIN_TOKEN: ${SPOTIBOYS_ADMIN_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/mlflow_persist_large/music:/music:ro
      - /mnt/mlflow_persist/spotiboys_v2/serving-bundle:/serving-bundle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      navidrome:
        condition: service_started
      seed-users-worker:
        condition: service_completed_successfully
      catalog-sync-worker:
        condition: service_completed_successfully
      navidrome-metadata-sync-worker:
        condition: service_completed_successfully
      artifact-fetch-worker:
        condition: service_completed_successfully

  delta-export-worker:
    <<: *recommendation-runtime
    command: ["python", "workers/delta-export-worker/export_and_trigger.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      NAVIDROME_BASE_URL: http://navidrome:4533
      NAVIDROME_USERNAME: spotiboys
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://host.docker.internal:8080}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
      SPOTIBOYS_RETRAIN_THRESHOLD: ${SPOTIBOYS_RETRAIN_THRESHOLD:-1000}
      SPOTIBOYS_DELTA_INTERVAL_SECONDS: ${SPOTIBOYS_DELTA_INTERVAL_SECONDS:-86400}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      recommendation-api:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: spotiboys
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8089:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - recommendation-api
      - navidrome
