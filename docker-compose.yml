services:
  training:
    build: .
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      - ARTIFACT_BUCKET=${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://129.114.25.207:8000/}
      - SPOTIBOYS_SERVICE_BASE_URL=${SPOTIBOYS_SERVICE_BASE_URL:-}
      - SPOTIBOYS_SERVICE_ADMIN_TOKEN=${SPOTIBOYS_SERVICE_ADMIN_TOKEN:-}
      - PYTHONWARNINGS=ignore:Unverified HTTPS request
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    shm_size: '10gb'
    # Override command at runtime:
    #   Phase 1 (initial training, Ray Tune sweep):
    #     docker-compose run training bash scripts/retrain.sh --phase1 --retrieve-version 20260417_051148
    #   Phase 2 (retrain after online delta):
    #     docker-compose run training bash scripts/retrain.sh --phase2
    command: ["bash", "-c", "echo 'Specify command: bash scripts/retrain.sh --phase1 --retrieve-version VERSION'"]
