services:
  training:
    build: .
    environment:
      - AWS_ACCESS_KEY_ID=11580ec852704238a35acfbd65c7146a
      - AWS_SECRET_ACCESS_KEY=2759a133cae84a8e9a48c609c4dbc1b1
      - AWS_ENDPOINT_URL=https://chi.tacc.chameleoncloud.org:7480
      - MLFLOW_TRACKING_URI=http://129.114.25.207:8000/
      - PYTHONWARNINGS=ignore:Unverified HTTPS request
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    shm_size: '10gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Override command at runtime:
    #   Phase 1 (initial training, Ray Tune sweep):
    #     docker-compose run training bash scripts/retrain.sh --phase1 --retrieve-version 20260417_051148
    #   Phase 2 (retrain after online delta):
    #     docker-compose run training bash scripts/retrain.sh --phase2
    command: ["bash", "-c", "echo 'Specify command: bash scripts/retrain.sh --phase1 --retrieve-version VERSION'"]
