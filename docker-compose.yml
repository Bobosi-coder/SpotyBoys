services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotiboys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - /mnt/mlflow_persist/spotiboys/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotiboys"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  navidrome:
    image: deluan/navidrome:latest
    environment:
      ND_SCANSCHEDULE: "1m"
      ND_LOGLEVEL: info
    volumes:
      - /mnt/mlflow_persist/spotiboys/navidrome:/data
      - /mnt/mlflow_persist_large/music:/music:ro
    expose:
      - "4533"

  navidrome-bootstrap:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "infra/scripts/bootstrap_navidrome.py"]
    environment:
      NAVIDROME_BASE_URL: http://navidrome:4533
      NAVIDROME_USERNAME: spotiboys
      NAVIDROME_PASSWORD: spotiboys
    depends_on:
      navidrome:
        condition: service_started

  recommendation-api:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      SPOTIBOYS_MEDIA_MODE: navidrome_vm_library
      SPOTIBOYS_MUSIC_ROOT: /music
      SPOTIBOYS_SERVING_BUNDLE_PATH: /serving-bundle/Real_service/active
      SPOTIBOYS_REQUIRE_FULL_ML_PIPELINE: ${SPOTIBOYS_REQUIRE_FULL_ML_PIPELINE:-true}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
      NAVIDROME_BASE_URL: http://navidrome:4533
      NAVIDROME_USERNAME: spotiboys
      NAVIDROME_PASSWORD: spotiboys
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://host.docker.internal:8080}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
      SPOTIBOYS_OBJECT_STORAGE_ROOT: /object-storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/mlflow_persist_large/music:/music:ro
      - /mnt/mlflow_persist/spotiboys/serving-bundle:/serving-bundle:ro
      - /mnt/mlflow_persist/spotiboys/object-storage:/object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      navidrome:
        condition: service_started
      catalog-sync-worker:
        condition: service_completed_successfully
      artifact-fetch-worker:
        condition: service_completed_successfully

  event-api:
    build:
      context: .
      dockerfile: apps/event-api/Dockerfile
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-sync-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/catalog-sync-worker/sync_catalog.py"]
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
      SPOTIBOYS_MEDIA_MODE: navidrome_vm_library
      SPOTIBOYS_MUSIC_ROOT: /music
      SPOTIBOYS_CATALOG_PROGRESS_EVERY: ${SPOTIBOYS_CATALOG_PROGRESS_EVERY:-500}
      SPOTIBOYS_CATALOG_SYNC_LIMIT: ${SPOTIBOYS_CATALOG_SYNC_LIMIT:-0}
      NAVIDROME_BASE_URL: http://navidrome:4533
      NAVIDROME_USERNAME: spotiboys
      NAVIDROME_PASSWORD: spotiboys
    volumes:
      - /mnt/mlflow_persist_large/music:/music:ro
    depends_on:
      postgres:
        condition: service_healthy
      navidrome:
        condition: service_started
      navidrome-bootstrap:
        condition: service_completed_successfully

  outcome-deriver-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/outcome-deriver-worker/derive_outcomes.py"]
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
    depends_on:
      postgres:
        condition: service_healthy

  parser-export-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/parser-export-worker/export_delta.py"]
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      SPOTIBOYS_OBJECT_STORAGE_ROOT: /object-storage
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
    volumes:
      - /mnt/mlflow_persist/spotiboys/object-storage:/object-storage
    depends_on:
      postgres:
        condition: service_healthy

  artifact-refresh-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/artifact-refresh-worker/refresh_artifacts.py"]
    profiles: ["jobs"]
    environment:
      SPOTIBOYS_OBJECT_STORAGE_ROOT: /object-storage
      SPOTIBOYS_ACTIVE_ARTIFACT_ROOT: /serving-bundle
    volumes:
      - /mnt/mlflow_persist/spotiboys/object-storage:/object-storage
      - /mnt/mlflow_persist/spotiboys/serving-bundle:/serving-bundle

  artifact-fetch-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/artifact-fetch-worker/fetch_remote_artifacts.py"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
      SPOTIBOYS_OBJECT_STORAGE_ROOT: /object-storage
      SPOTIBOYS_ACTIVE_ARTIFACT_ROOT: /serving-bundle
    volumes:
      - /mnt/mlflow_persist/spotiboys/object-storage:/object-storage
      - /mnt/mlflow_persist/spotiboys/serving-bundle:/serving-bundle

  delta-trigger-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/delta-trigger-worker/trigger_delta_export.py"]
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      SPOTIBOYS_OBJECT_STORAGE_ROOT: /object-storage
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://host.docker.internal:8080}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://chi.tacc.chameleoncloud.org:7480}
      S3_NO_VERIFY_SSL: ${S3_NO_VERIFY_SSL:-true}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-proj23-mlflow-artifacts}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/mlflow_persist/spotiboys/object-storage:/object-storage
    depends_on:
      postgres:
        condition: service_healthy

  live-data-monitor-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/live-data-monitor-worker/monitor_live_data.py"]
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      SPOTIBOYS_OBJECT_STORAGE_ROOT: /object-storage
    volumes:
      - /mnt/mlflow_persist/spotiboys/object-storage:/object-storage
    depends_on:
      postgres:
        condition: service_healthy

  serving-monitor-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/serving-monitor-worker/rollup_metrics.py", "--window", "5m", "--window", "1h", "--print-json"]
    profiles: ["jobs"]
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  rollback-check-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/rollback-check-worker/check_rollback.py"]
    profiles: ["jobs"]
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
      SPOTIBOYS_OBJECT_STORAGE_ROOT: /object-storage
      SPOTIBOYS_ACTIVE_ARTIFACT_ROOT: /serving-bundle
      SPOTIBOYS_AUTO_ROLLBACK: ${SPOTIBOYS_AUTO_ROLLBACK:-false}
    volumes:
      - /mnt/mlflow_persist/spotiboys/object-storage:/object-storage
      - /mnt/mlflow_persist/spotiboys/serving-bundle:/serving-bundle
    depends_on:
      postgres:
        condition: service_healthy

  restart-monitor-worker:
    build:
      context: .
      dockerfile: apps/recommendation-api/Dockerfile
    command: ["python", "workers/restart-monitor-worker/monitor_restart.py"]
    profiles: ["jobs"]
    environment:
      SPOTIBOYS_ACTIVE_ARTIFACT_ROOT: /serving-bundle
      RECOMMENDATION_API_CONTAINER: spotyboys_service-recommendation-api-1
    volumes:
      - /mnt/mlflow_persist/spotiboys/serving-bundle:/serving-bundle
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - recommendation-api

  frontend-web:
    build:
      context: .
      dockerfile: apps/frontend-web/Dockerfile
    depends_on:
      - recommendation-api
      - event-api

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: spotiboys
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8089:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - recommendation-api
      - event-api
      - frontend-web
