services:
  training:
    build: .
    environment:
      - AWS_ACCESS_KEY_ID=11580ec852704238a35acfbd65c7146a
      - AWS_SECRET_ACCESS_KEY=2759a133cae84a8e9a48c609c4dbc1b1
      - AWS_ENDPOINT_URL=https://chi.tacc.chameleoncloud.org:7480
      - MLFLOW_TRACKING_URI=http://129.114.25.207:8000/
      - PYTHONWARNINGS=ignore:Unverified HTTPS request
