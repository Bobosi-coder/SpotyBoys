upstream frontend_web {
    server frontend-web:5173;
}

upstream recommendation_api {
    server recommendation-api:8001;
}

upstream event_api {
    server event-api:8002;
}

server {
    listen 80;
    server_name _;

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"spotiboys-proxy"}';
    }

    location /session/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recommendations/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /playable-track/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stream/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /covers/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /monitoring/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recommendation-health {
        proxy_pass http://recommendation_api/health;
    }

    location /recommendation-ready {
        proxy_pass http://recommendation_api/ready;
    }

    location /events/ {
        proxy_pass http://event_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /event-health {
        proxy_pass http://event_api/health;
    }

    location / {
        proxy_pass http://frontend_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
