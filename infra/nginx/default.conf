upstream navidrome {
    server navidrome:4533;
}

upstream recommendation_api {
    server recommendation-api:8001;
}

server {
    listen 80;
    server_name _;

    # ── Internal token validation subrequest (used by auth_request) ──
    location = /auth/validate {
        internal;
        proxy_pass              http://recommendation_api/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # ── Redirect target for unauthenticated Navidrome requests ───────
    location @login_redirect {
        return 302 /login;
    }

    # ── Public endpoints (no auth required) ──────────────────────────
    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"spotiboys-proxy"}';
    }

    location = /login {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recommendation-health {
        proxy_pass http://recommendation_api/health;
    }

    location /recommendation-ready {
        proxy_pass http://recommendation_api/ready;
    }

    # ── SpotyBoys API routes (Bearer token auth, bypass auth_request) ─
    location /spotiboys/auth/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /session/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /recommendations/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /playable-track/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stream/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /covers/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /monitoring/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /events/ {
        proxy_pass http://recommendation_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Navidrome (requires SpotyBoys auth cookie) ────────────────────
    location / {
        auth_request      /auth/validate;
        auth_request_set  $auth_user $upstream_http_x_user_int_id;

        # Override Remote-User with validated value (strips any client-supplied header)
        proxy_set_header  Remote-User $auth_user;

        error_page 401 = @login_redirect;

        proxy_pass http://navidrome;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for Navidrome's WebSocket connections (audio player)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
