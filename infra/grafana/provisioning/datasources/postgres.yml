apiVersion: 1

datasources:
  - name: SpotyBoys-PostgreSQL
    type: postgres
    uid: spotiboys-pg
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: spotiboys
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1400
      timescaledb: false
    isDefault: true
    editable: false
