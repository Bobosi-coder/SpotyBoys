services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spotiboys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotiboys"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  recommendation-api:
    build:
      context: ../..
      dockerfile: apps/recommendation-api/Dockerfile
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
      SPOTIBOYS_FIXTURE_PATH: /app/fixtures/demo_catalog.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  event-api:
    build:
      context: ../..
      dockerfile: apps/event-api/Dockerfile
    environment:
      SPOTIBOYS_RUNTIME_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spotiboys
      REDIS_URL: redis://redis:6379/0
      SPOTIBOYS_FIXTURE_PATH: /app/fixtures/demo_catalog.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-web:
    build:
      context: ../..
      dockerfile: apps/frontend-web/Dockerfile
    depends_on:
      - recommendation-api
      - event-api

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "5173:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - recommendation-api
      - event-api
      - frontend-web
